apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "sample-nodejs.fullname" . }}-test-connection"
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["curl"]
      args:
        - "-sf"
        - "http://{{ include "sample-nodejs.fullname" . }}:{{ .Values.service.port }}/ready"
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
