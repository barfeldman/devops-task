{{- if .Values.vault.enabled }}
# Vault Secrets Operator resources: authenticate to Vault with this app's
# ServiceAccount (Kubernetes auth) and sync the KV v2 secret into a native
# Secret that the Deployment consumes via envFrom.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: {{ include "sample-nodejs.fullname" . }}
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
spec:
  address: {{ .Values.vault.address | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ include "sample-nodejs.fullname" . }}
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
spec:
  vaultConnectionRef: {{ include "sample-nodejs.fullname" . }}
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ .Values.vault.role | quote }}
    serviceAccount: {{ include "sample-nodejs.serviceAccountName" . }}
    audiences:
      - {{ .Values.vault.audience | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "sample-nodejs.fullname" . }}
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ include "sample-nodejs.fullname" . }}
  type: kv-v2
  mount: {{ .Values.vault.mount | quote }}
  path: {{ .Values.vault.path | quote }}
  refreshAfter: {{ .Values.vault.refreshAfter | quote }}
  destination:
    name: {{ .Values.vault.secretName | quote }}
    create: true
  # Roll the Deployment automatically when the secret rotates.
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "sample-nodejs.fullname" . }}
{{- end }}
