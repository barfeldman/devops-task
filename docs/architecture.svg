<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a5560"/>
    </marker>
    <marker id="arrowlite" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#8a97a3"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1078" height="718" fill="#ffffff" stroke="#dfe4ea"/>

  <!-- ===== nodes ===== -->
  <!-- developer -->
  <rect x="60" y="72" width="150" height="56" rx="8" fill="#ffffff" stroke="#33404d" stroke-width="1.5"/>
  <text x="135" y="105" text-anchor="middle" font-size="15" fill="#1f2933">Developer</text>

  <!-- github repo -->
  <rect x="300" y="64" width="200" height="80" rx="8" fill="#ffffff" stroke="#33404d" stroke-width="1.5"/>
  <text x="400" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">GitHub repo</text>
  <text x="400" y="118" text-anchor="middle" font-size="11" fill="#52616b">app + Helm chart + Argo manifests</text>

  <!-- jenkins group -->
  <rect x="600" y="52" width="440" height="156" rx="10" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="620" y="78" font-size="15" font-weight="600" fill="#1f2933">Jenkins pipeline</text>
  <text x="620" y="96" font-size="11" fill="#52616b">runs on ephemeral Kubernetes agents</text>
  <!-- chips -->
  <rect x="612" y="112" width="76" height="48" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="650" y="132" text-anchor="middle" font-size="12" fill="#1f2933">test</text>
  <text x="650" y="148" text-anchor="middle" font-size="9.5" fill="#52616b">smoke</text>
  <rect x="694" y="112" width="76" height="48" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="732" y="132" text-anchor="middle" font-size="12" fill="#1f2933">SAST</text>
  <text x="732" y="148" text-anchor="middle" font-size="9.5" fill="#52616b">Semgrep</text>
  <rect x="776" y="112" width="72" height="48" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="812" y="132" text-anchor="middle" font-size="12" fill="#1f2933">build</text>
  <text x="812" y="148" text-anchor="middle" font-size="9.5" fill="#52616b">Kaniko</text>
  <rect x="854" y="112" width="72" height="48" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="890" y="132" text-anchor="middle" font-size="12" fill="#1f2933">scan</text>
  <text x="890" y="148" text-anchor="middle" font-size="9.5" fill="#52616b">Trivy</text>
  <rect x="932" y="112" width="96" height="48" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="980" y="132" text-anchor="middle" font-size="12" fill="#1f2933">push</text>
  <text x="980" y="148" text-anchor="middle" font-size="9.5" fill="#52616b">skopeo</text>
  <!-- chip connectors -->
  <path d="M688,136 H694" stroke="#8a97a3" fill="none" marker-end="url(#arrowlite)"/>
  <path d="M770,136 H776" stroke="#8a97a3" fill="none" marker-end="url(#arrowlite)"/>
  <path d="M848,136 H854" stroke="#8a97a3" fill="none" marker-end="url(#arrowlite)"/>
  <path d="M926,136 H932" stroke="#8a97a3" fill="none" marker-end="url(#arrowlite)"/>

  <!-- registry -->
  <rect x="610" y="250" width="180" height="58" rx="8" fill="#f3eefb" stroke="#6f4bb0" stroke-width="1.5"/>
  <text x="700" y="275" text-anchor="middle" font-size="14" fill="#1f2933">Container registry</text>
  <text x="700" y="293" text-anchor="middle" font-size="11" fill="#52616b">GHCR</text>

  <!-- argo cd -->
  <rect x="300" y="300" width="170" height="64" rx="8" fill="#fdf0e6" stroke="#d1743b" stroke-width="1.5"/>
  <text x="385" y="328" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">Argo CD</text>
  <text x="385" y="348" text-anchor="middle" font-size="11" fill="#52616b">GitOps sync</text>

  <!-- kubernetes cluster -->
  <rect x="600" y="378" width="440" height="300" rx="12" fill="#eef2f7" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="620" y="404" font-size="14" font-weight="600" fill="#1f2933">Kubernetes cluster (minikube)</text>

  <rect x="628" y="430" width="150" height="50" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="703" y="450" text-anchor="middle" font-size="12.5" fill="#1f2933">Ingress (nginx)</text>
  <text x="703" y="468" text-anchor="middle" font-size="10" fill="#52616b">sample-nodejs.local</text>

  <rect x="628" y="520" width="150" height="46" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="703" y="540" text-anchor="middle" font-size="12.5" fill="#1f2933">Service</text>
  <text x="703" y="557" text-anchor="middle" font-size="10" fill="#52616b">ClusterIP :80</text>

  <rect x="840" y="430" width="180" height="46" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="930" y="457" text-anchor="middle" font-size="12" fill="#1f2933">Pod &#183; sample-nodejs</text>
  <rect x="840" y="486" width="180" height="46" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="930" y="513" text-anchor="middle" font-size="12" fill="#1f2933">Pod &#183; sample-nodejs</text>

  <rect x="840" y="562" width="180" height="42" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-dasharray="4 3"/>
  <text x="930" y="587" text-anchor="middle" font-size="11" fill="#52616b">Secret &#183; ConfigMap &#183; SA</text>

  <!-- HashiCorp Vault + Vault Secrets Operator: source of the app Secret -->
  <rect x="628" y="602" width="196" height="46" rx="6" fill="#fef9e7" stroke="#b7950b"/>
  <text x="726" y="622" text-anchor="middle" font-size="11.5" fill="#1f2933">HashiCorp Vault + VSO</text>
  <text x="726" y="638" text-anchor="middle" font-size="9.5" fill="#7d6608">Kubernetes auth &#183; KV v2</text>
  <path d="M824,614 L 848,590" stroke="#b7950b" fill="none" marker-end="url(#arrow)"/>
  <text x="806" y="598" font-size="9.5" fill="#7d6608">sync secret</text>

  <text x="852" y="666" font-size="10.5" font-style="italic" fill="#7b8794">namespace: sample-nodejs</text>

  <!-- cluster internal arrows -->
  <path d="M703,480 V520" stroke="#4a5560" fill="none" marker-end="url(#arrow)"/>
  <path d="M778,538 C 812,533 815,468 840,455" stroke="#4a5560" fill="none" marker-end="url(#arrow)"/>
  <path d="M778,544 C 815,552 818,505 840,509" stroke="#4a5560" fill="none" marker-end="url(#arrow)"/>

  <!-- user -->
  <rect x="60" y="486" width="150" height="56" rx="8" fill="#ffffff" stroke="#33404d" stroke-width="1.5"/>
  <text x="135" y="519" text-anchor="middle" font-size="15" fill="#1f2933">User / browser</text>

  <!-- ===== flows ===== -->
  <path d="M210,100 H300" stroke="#4a5560" fill="none" marker-end="url(#arrow)"/>
  <text x="255" y="92" text-anchor="middle" font-size="10.5" fill="#52616b">git push</text>

  <path d="M500,100 H600" stroke="#4a5560" fill="none" marker-end="url(#arrow)"/>
  <text x="550" y="92" text-anchor="middle" font-size="10.5" fill="#52616b">webhook</text>

  <path d="M700,208 V250" stroke="#4a5560" fill="none" marker-end="url(#arrow)"/>
  <text x="708" y="232" font-size="10.5" fill="#52616b">push image</text>

  <path d="M628,208 C 560,214 520,172 505,148" stroke="#4a5560" fill="none" marker-end="url(#arrow)"/>
  <text x="512" y="200" font-size="10.5" fill="#52616b">commit image tag</text>

  <path d="M388,144 V300" stroke="#4a5560" fill="none" marker-end="url(#arrow)"/>
  <text x="394" y="228" font-size="10.5" fill="#52616b">reconcile</text>

  <path d="M470,330 C 545,330 555,412 600,434" stroke="#4a5560" fill="none" marker-end="url(#arrow)"/>
  <text x="486" y="356" font-size="10.5" fill="#52616b">helm upgrade</text>

  <path d="M700,308 V378" stroke="#8a97a3" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowlite)"/>
  <text x="708" y="346" font-size="10.5" fill="#7b8794">image pull</text>

  <path d="M210,510 C 400,512 470,470 628,456" stroke="#4a5560" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="474" text-anchor="middle" font-size="10.5" fill="#52616b">browse via Ingress</text>
</svg>
